<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="FlashFX — WebGPU Motion Graphics &amp; Video Editor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="0.55" stop-color="#0a0f16"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#f7b500"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7b500" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#f7b500" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="250" rx="620" ry="380" fill="url(#glow)"/>

  <!-- faint timeline / grid motif -->
  <g stroke="#1a2a42" stroke-width="1" opacity="0.5">
    <line x1="0" y1="470" x2="1200" y2="470"/>
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="570" x2="1200" y2="570"/>
  </g>
  <g fill="#f7b500" opacity="0.16">
    <rect x="90" y="452" width="220" height="34" rx="6"/>
    <rect x="330" y="502" width="360" height="34" rx="6"/>
    <rect x="150" y="552" width="150" height="34" rx="6"/>
    <rect x="720" y="502" width="180" height="34" rx="6"/>
  </g>

  <!-- mark -->
  <rect x="96" y="150" width="132" height="132" rx="34" fill="url(#amber)"/>
  <polygon points="176 178 118 256 158 256 151 306 210 224 168 224" fill="#0a0f16"/>

  <!-- wordmark -->
  <text x="264" y="248" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif" font-size="120" font-weight="800" letter-spacing="-3">
    <tspan fill="#f8fafc">Flash</tspan><tspan fill="#f7b500">FX</tspan>
  </text>

  <!-- tagline -->
  <text x="100" y="372" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif" font-size="44" font-weight="600" fill="#cbd5e1">WebGPU Motion Graphics &amp; Video Editor</text>
  <text x="100" y="424" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif" font-size="27" font-weight="400" fill="#7c8aa0">Animate text, shapes, particles, 2.5D cameras &amp; effects — right in the browser.</text>

  <text x="1100" y="600" text-anchor="end" font-family="Inter, Segoe UI, system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#f7b500">flashfx.app</text>
</svg>
