name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Hard gates — these must pass.
      - name: Typecheck
        run: npm run typecheck

      - name: Test (verify harnesses)
        run: npm test

      - name: Build
        run: npm run build

      # Informational — the repo carries a known lint baseline (errors that predate the
      # gate), so eslint exits non-zero; surface it without failing the build.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
