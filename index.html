<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>FlashFX - WebGPU Motion Graphics &amp; Video Editor</title>
    <meta name="description" content="FlashFX is a browser-based WebGPU motion-graphics and short-form video editor. Animate text, shapes, particles, 2.5D cameras and effects with keyframes and expressions, then export — no install, runs in your browser." />
    <meta name="keywords" content="motion graphics editor, video editor, WebGPU, browser video editor, animation, keyframes, particles, 2.5D, short-form video, FlashFX" />
    <meta name="author" content="FlashFX" />
    <meta name="application-name" content="FlashFX" />
    <meta name="apple-mobile-web-app-title" content="FlashFX" />
    <meta name="theme-color" content="#0a0f16" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Bing Webmaster Tools site verification. After adding the site in Bing Webmaster Tools,
         choose the "HTML Meta Tag" option and paste the tag it gives you directly below, e.g.:
           <meta name="msvalidate.01" content="YOUR_BING_VERIFICATION_CODE" />
         (Alternatives that need no code change: import from Google Search Console, upload the
         BingSiteAuth.xml file to the site root, or add the CNAME DNS record Bing provides.) -->

    <!-- Google Search Console verification (optional; same idea):
           <meta name="google-site-verification" content="YOUR_GOOGLE_VERIFICATION_CODE" /> -->

    <!-- Canonical: this app is self-canonical; it is part of the FlashFX site (flashfx.app),
         declared via the Organization/WebSite structured data below. -->
    <link rel="canonical" href="https://editor.flashfx.app/" />

    <!-- Icons + PWA -->
    <link rel="icon" type="image/svg+xml" href="/flashfx-mark.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlashFX" />
    <meta property="og:title" content="FlashFX - WebGPU Motion Graphics &amp; Video Editor" />
    <meta property="og:description" content="Animate text, shapes, particles, 2.5D cameras and effects with keyframes and expressions, then export — all in your browser. No install." />
    <meta property="og:url" content="https://editor.flashfx.app/" />
    <meta property="og:image" content="https://editor.flashfx.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FlashFX - WebGPU Motion Graphics & Video Editor" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlashFX - WebGPU Motion Graphics &amp; Video Editor" />
    <meta name="twitter:description" content="Animate text, shapes, particles, 2.5D cameras and effects with keyframes and expressions, then export — all in your browser." />
    <meta name="twitter:image" content="https://editor.flashfx.app/og-image.png" />
    <meta name="twitter:image:alt" content="FlashFX - WebGPU Motion Graphics & Video Editor" />

    <!-- Structured data: the app + the FlashFX brand (sameAs flashfx.app) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://flashfx.app/#website",
          "url": "https://flashfx.app/",
          "name": "FlashFX",
          "publisher": { "@id": "https://flashfx.app/#organization" }
        },
        {
          "@type": "Organization",
          "@id": "https://flashfx.app/#organization",
          "name": "FlashFX",
          "url": "https://flashfx.app/",
          "logo": "https://editor.flashfx.app/flashfx-mark.svg",
          "sameAs": ["https://flashfx.app/"]
        },
        {
          "@type": "WebApplication",
          "name": "FlashFX",
          "url": "https://editor.flashfx.app/",
          "applicationCategory": "MultimediaApplication",
          "operatingSystem": "Web browser with WebGPU (Chromium-based)",
          "browserRequirements": "Requires WebGPU",
          "description": "Browser-based WebGPU motion-graphics and short-form video editor. Animate text, shapes, particles, 2.5D cameras and effects with keyframes and expressions, then export.",
          "image": "https://editor.flashfx.app/og-image.png",
          "isPartOf": { "@id": "https://flashfx.app/#website" },
          "publisher": { "@id": "https://flashfx.app/#organization" },
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
        }
      ]
    }
    </script>
  </head>
  <body style="margin:0;background:#0a0f16">
    <div id="root">
      <!-- Instant loader shown while the JS bundle downloads/parses; React replaces #root's
           contents on mount (the deep-link splash then takes over seamlessly for ?template links). -->
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0a0f16;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
        <div style="width:28px;height:28px;border:2px solid rgba(247,181,0,0.25);border-top-color:#f7b500;border-radius:50%;animation:ffxspin 0.8s linear infinite"></div>
        <div style="color:#cbd5e1;font-size:13px;font-weight:500">Loading editor…</div>
        <style>@keyframes ffxspin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
